name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out Karu
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Match VERSION to the tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "VERSION is $version but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            id: linux-x86_64
            os: ubuntu-24.04
          - name: macOS arm64
            id: macos-arm64
            os: macos-15
          - name: Windows x86_64
            id: windows-x86_64
            os: windows-2022
    steps:
      - name: Check out Karu
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libcurl4-openssl-dev libssl-dev

      - name: Install native dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install curl:x64-windows openssl:x64-windows

      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3

      - name: Configure
        shell: bash
        run: |
          args=(
            -DCMAKE_BUILD_TYPE=Release
            -DKARU_BUILD_TESTS=ON
            -DKARU_WERROR=ON
          )
          if [[ "$RUNNER_OS" == Windows ]]; then
            args+=("-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake")
          elif [[ "$RUNNER_OS" == macOS ]]; then
            args+=("-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)")
          fi
          cmake -S . -B build "${args[@]}"

      - name: Build and test
        run: |
          cmake --build build --config Release --parallel 4
          ctest --test-dir build -C Release --output-on-failure

      - name: Install and archive
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build --config Release --prefix "$GITHUB_WORKSPACE/build/stage"
          cmake -E make_directory "$GITHUB_WORKSPACE/artifacts"
          base="karu-${{ needs.validate.outputs.version }}-${{ matrix.id }}"
          if [[ "$RUNNER_OS" == Windows ]]; then
            cmake -E chdir build/stage cmake -E tar cf \
              "$GITHUB_WORKSPACE/artifacts/$base.zip" --format=zip .
          else
            cmake -E chdir build/stage cmake -E tar czf \
              "$GITHUB_WORKSPACE/artifacts/$base.tar.gz" .
          fi

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: karu-${{ matrix.id }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: karu-*
          path: artifacts
          merge-multiple: true
      - name: Write checksums
        run: |
          cd artifacts
          sha256sum karu-* > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" artifacts/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "Karu ${{ needs.validate.outputs.version }}"
          --generate-notes
