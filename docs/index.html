      <figure class="batch" id="batch" data-label="One client.submit of four reads, A to D, across your code, the Karu engine and storage. The planner turns them into two GETs on an S3 object, one covering A, B and C and reading the small gap between B and C, the other covering D, or into three preads on a local file that skip the gap. The transport runs every request at once, scatter puts each read's bytes in its buffer and drops the gap, and batch.next returns the reads as their requests end."></figure>
